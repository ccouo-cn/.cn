<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>UTF8 ↔ Float 调用示例</title>
<style>
    body {
        background: #1a1a1a;
        color: #e8cfcf;
        font-family: Consolas, monospace;
        margin: 0;
        padding: 20px;
    }
    .wrap {
        max-width: 900px;
        margin: auto;
    }
    h2 {
        color: #d99a9a;
        border-bottom: 1px solid #552e2e;
        padding-bottom: 6px;
    }
    textarea, input, select, button {
        width: 100%;
        background: #2a1f1f;
        color: #f0d6d6;
        border: 1px solid #663333;
        padding: 8px;
        margin: 6px 0 14px;
        box-sizing: border-box;
        border-radius: 0;
    }
    button {
        cursor: pointer;
        background: #552e2e;
    }
    button:hover {
        background: #703c3c;
    }
    label {
        font-size: 13px;
        color: #c28a8a;
    }
</style>
</head>
<body>
<div class="wrap">

<h2>UTF8 ↔ Float 调用工具</h2>

<label>后端地址（不可修改）</label>
<input value="https://api.yuzusoft.pw/float.go" disabled />

<label>模式</label>
<select id="mode">
    <option value="encrypt">UTF-8 → Float（加密）</option>
    <option value="decrypt">Float → UTF-8（解密）</option>
</select>

<label>Key（SHA-256 自动生成，8～64 位）</label>
<input id="key" readonly />

<hr style="border-color:#552e2e;margin:18px 0">

<label>方式一：手动输入字符串（GET）</label>
<textarea id="textInput" rows="5" placeholder="输入文本或 float 数组"></textarea>
<button onclick="sendGet()">GET 方式发送</button>

<hr style="border-color:#552e2e;margin:18px 0">

<label>方式二：选择文件（POST，文件内容走 body）</label>
<input type="file" id="fileInput" />
<button onclick="sendPost()">POST 方式发送</button>

<hr style="border-color:#552e2e;margin:18px 0">

<label>返回结果</label>
<textarea id="output" rows="8" readonly></textarea>

</div>

<script>
/* 生成随机字符串 */
function randomString(len) {
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    let s = "";
    for (let i = 0; i < len; i++) {
        s += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return s;
}

/* SHA-256 + 自动裁剪/补齐到 8～64 位 */
async function generateKey() {
    const raw = randomString(64);
    const buf = new TextEncoder().encode(raw);
    const hashBuf = await crypto.subtle.digest("SHA-256", buf);
    let hex = Array.from(new Uint8Array(hashBuf))
        .map(b => b.toString(16).padStart(2, "0"))
        .join("");

    if (hex.length < 8) {
        hex = hex.padEnd(8, "0");
    }
    if (hex.length > 64) {
        hex = hex.slice(0, 64);
    }
    return hex;
}

/* 初始化 Key */
(async () => {
    document.getElementById("key").value = await generateKey();
})();

function setOutput(msg) {
    document.getElementById("output").value = msg;
}

/* GET：字符串 */
function sendGet() {
    const mode = document.getElementById("mode").value;
    const key = document.getElementById("key").value;
    const input = document.getElementById("textInput").value.trim();
    const base = "https://api.yuzusoft.pw/float.go";

    if (!input) {
        setOutput("请输入字符串");
        return;
    }

    let url = `${base}?key=${encodeURIComponent(key)}`;
    if (mode === "encrypt") {
        url += `&utf=${encodeURIComponent(input)}`;
    } else {
        url += `&float=${encodeURIComponent(input)}`;
    }

    fetch(url)
        .then(async res => {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.text();
        })
        .then(data => setOutput(data))
        .catch(err => setOutput("请求失败：" + err.message));
}

/* POST：文件 */
function sendPost() {
    const mode = document.getElementById("mode").value;
    const key = document.getElementById("key").value;
    const file = document.getElementById("fileInput").files[0];
    const base = "https://api.yuzusoft.pw/float.go";

    if (!file) {
        setOutput("请选择文件");
        return;
    }

    const reader = new FileReader();
    reader.onload = function () {
        const url = `${base}?key=${encodeURIComponent(key)}`;
        const contentType = mode === "decrypt"
            ? "application/json"
            : "text/plain";

        fetch(url, {
            method: "POST",
            headers: { "Content-Type": contentType },
            body: reader.result
        })
        .then(async res => {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.text();
        })
        .then(data => setOutput(data))
        .catch(err => setOutput("请求失败：" + err.message));
    };

    reader.readAsText(file);
}
</script>
</body>
</html>
