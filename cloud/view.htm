<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>作品详情 - www.ccouo.cn</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #fafafa;
            min-height: 100vh;
            color: #333;
        }
        
        .top-line {
            height: 3px;
            background: linear-gradient(90deg, #e91e63, #f48fb1, #e91e63);
        }
        
        .page { padding: 20px 18px 30px; max-width: 520px; margin: 0 auto; }
        
        /* 顶部栏 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .top-bar h2 {
            font-size: 15px;
            font-weight: 600;
            color: #e91e63;
            letter-spacing: 0.5px;
        }
        .top-bar h2 i { margin-right: 6px; }
        
        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #e91e63;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            padding: 8px 18px;
            border: 1.5px solid #e91e63;
            border-radius: 10px;
            background: #fff;
            transition: all 0.2s;
        }
        .home-btn:active {
            background: #fce4ec;
            transform: scale(0.97);
        }
        
        /* 加载/错误 */
        .loading {
            text-align: center;
            padding: 100px 0;
            color: #e91e63;
            font-size: 15px;
        }
        .loading i {
            display: block;
            font-size: 28px;
            margin-bottom: 12px;
            color: #f48fb1;
        }
        .error {
            text-align: center;
            padding: 100px 0;
            color: #e91e63;
            font-size: 14px;
        }
        .error i {
            display: block;
            font-size: 32px;
            margin-bottom: 10px;
            opacity: 0.6;
        }
        
        /* 作品信息 */
        .title {
            font-size: 22px;
            font-weight: 800;
            color: #1a1a1a;
            margin-bottom: 14px;
            line-height: 1.35;
            letter-spacing: -0.3px;
        }
        .tag-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .tag {
            background: #fce4ec;
            color: #e91e63;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 6px;
            letter-spacing: 0.3px;
        }
        .tag i { margin-right: 5px; opacity: 0.85; }
        
        /* 图片区域标题 */
        .section-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #e91e63;
            margin-bottom: 12px;
        }
        
        /* 图片横向滚动 */
        .image-scroll {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            margin-bottom: 24px;
            padding-bottom: 6px;
        }
        .image-scroll::-webkit-scrollbar { height: 3px; }
        .image-scroll::-webkit-scrollbar-thumb { background: #f8bbd0; border-radius: 2px; }
        .image-scroll img {
            height: 210px;
            width: auto;
            border-radius: 10px;
            object-fit: contain;
            background: #f0f0f0;
            flex-shrink: 0;
            box-shadow: 0 1px 6px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .image-scroll img:active {
            transform: scale(0.97);
        }
        
        /* 下载按钮 */
        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: linear-gradient(135deg, #e91e63, #f06292);
            color: #fff;
            padding: 16px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            border: none;
            box-shadow: 0 4px 14px rgba(233, 30, 99, 0.3);
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .download-btn:active {
            transform: scale(0.98);
            box-shadow: 0 2px 8px rgba(233, 30, 99, 0.25);
        }
        
        /* 底部 */
        .footer {
            text-align: center;
            margin-top: 28px;
            font-size: 11px;
            color: #ccc;
        }
        .footer i { margin-right: 4px; }
        
        /* ====== 广告位 ====== */
    </style>
</head>
<body>
    <div class="top-line"></div>
    <div class="page" id="app">
        <div class="loading">
            <i class="fas fa-spinner fa-spin"></i>
            加载中
        </div>
    </div>

    <script>
        const categoryMap = {
            'm': '萌作',
            'x': '校园',
        };

        const params = new URLSearchParams(window.location.search);
        const workId = params.get('pan');

        if (!workId) {
            document.getElementById('app').innerHTML = '<div class="error"><i class="fas fa-circle-exclamation"></i>参数错误：缺少 pan</div>';
        } else {
            loadDetail();
        }

        function loadDetail() {
            const parts = workId.split('_');
            const iniNumber = parts[1] || '1';
            const url = `https://cdn.ccouo.online/?url=https://yuzusoft.pw/game/${iniNumber}.ini`;

            fetch(url)
                .then(res => res.text())
                .then(text => {
                    const line = text.split('\n').find(l => l.trim().startsWith(workId + ','));
                    if (!line) { showError('未找到作品数据'); return; }
                    renderDetail(line.split(','));
                })
                .catch(err => showError('加载失败: ' + err.message));
        }

        function renderDetail(p) {
            if (p.length < 5) { showError('数据格式错误'); return; }

            const uploader = p[1];
            const cat = p[2];
            const name = p[3];
            const link = p[4];
            const images = p.slice(5).filter(s => s.trim() !== '');
            const realUrl = fixUrl(link);
            const catDisplay = categoryMap[cat] || cat;

            let html = `
                <div class="top-bar">
                    <h2><i class="fas fa-film"></i>作品详情</h2>
                    <a class="home-btn" href="https://www.ccouo.cn/"><i class="fas fa-home"></i>官方主页</a>
                </div>
                <div class="title"><i class="fas fa-book-open" style="color:#f48fb1;font-size:18px;margin-right:6px;"></i>${escapeHtml(name)}</div>
                <div class="tag-row">
                    <span class="tag"><i class="fas fa-user-circle"></i>上传者：${escapeHtml(uploader)}</span>
                    <span class="tag"><i class="fas fa-folder"></i>分类：${escapeHtml(catDisplay)}</span>
                    <span class="tag"><i class="fas fa-hashtag"></i>ID：${escapeHtml(workId)}</span>
                </div>
            `;

            if (images.length > 0) {
                html += `
                    <div class="section-title">
                        <i class="fas fa-images"></i>作品预览
                        <span style="color:#ccc;font-weight:400;font-size:12px;">（共 ${images.length} 张）</span>
                    </div>
                    <div class="image-scroll">
                `;
                images.forEach(img => {
                    const fixed = fixUrl(img);
                    html += `<img src="${fixed}" alt="作品图片" loading="lazy" onclick="window.open('${fixed}','_blank','noreferrer')">`;
                });
                html += '</div>';
            }

            html += `
                <a class="download-btn" href="${realUrl}" target="_blank" rel="noreferrer">
                    <i class="fas fa-cloud-arrow-down"></i> 夸克网盘下载
                </a>
                <div class="footer">
                    <i class="fas fa-heart" style="color:#f48fb1;"></i> www.ccouo.cn
                </div>
            `;

            document.getElementById('app').innerHTML = html;
        }

        function fixUrl(u) {
            if (u.startsWith('k*')) return 'https://pan.quark.cn/s/' + u.substring(2);
            if (u.startsWith('g*')) return 'https://cdn.jsdelivr.net/gh/ccouo-cn/image@main/' + u.substring(2);
            if (u.startsWith('tx*')) return 'https://channel.qpic.cn/psc?/channel/' + u.substring(3);
            return u;
        }

        function showError(msg) {
            document.getElementById('app').innerHTML = `<div class="error"><i class="fas fa-circle-exclamation"></i>${msg}</div>`;
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
