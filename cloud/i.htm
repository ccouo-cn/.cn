00px;min-width:170px}label{display:block;font-size:16px;font-weight:700;color:#1f344a;margin-bottom:3px;letter-spacing:0.2px}label i{margin-right:6px;color:#2d5a7a;width:18px}input[type="number"],input[type="text"]{width:100%;padding:8px 12px;border:2px inset#b3c6d8;background:#fafdff;color:#0b1f31;font-size:15px;font-family:'Courier New',Courier,monospace;margin-bottom:14px;box-shadow:inset 1px 1px 3px rgba(0,0,0,0.06)}input[type="number"]:focus,input[type="text"]:focus{border-color:#3f7193;background:#ffffff;outline:2px solid#b0c9de}input[type="file"]{width:100%;padding:6px 0 6px 6px;border:2px inset#b3c6d8;background:#fafdff;font-size:14px;font-family:'Times New Roman',Times,serif;margin-bottom:14px;cursor:pointer}input[type="file"]::file-selector-button{background:#d7e2ed;border:2px outset#b3c6da;padding:4px 18px;font-weight:bold;color:#1b3349;margin-right:18px;cursor:pointer;font-family:'Times New Roman',Times,serif;font-size:14px}input[type="file"]::file-selector-button:hover{background:#c4d3e2;border-color:#9bb0c4}.checkbox-group{display:flex;flex-wrap:wrap;gap:24px 44px;margin:6px 0 14px 0;background:#e1e9f2;padding:8px 18px;border:2px ridge#b3c6d8}.checkbox-group label{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;color:#102433;cursor:pointer;margin-bottom:0}.checkbox-group input[type="checkbox"]{width:18px;height:18px;accent-color:#2f5b7a;margin:0;cursor:pointer}.badge{display:inline-block;padding:0 12px;border:2px outset#b0c4d8;font-size:12px;font-weight:bold;background:#d2deea;color:#1e3c54;letter-spacing:0.5px;font-family:'Courier New',monospace;box-shadow:inset 1px 1px 0#f4faff,inset-1px-1px 0#9aafc0}.badge.on{background:#b7d0e5;border-color:#7b9eb8;color:#0a2940}.badge.off{background:#cbd7e3;color:#405b72}.btn-group{display:flex;flex-wrap:wrap;gap:16px;margin:6px 0 4px}button{padding:8px 28px;border:3px outset#bccedf;background:#dee8f2;font-size:16px;font-weight:700;color:#0f293f;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-family:'Times New Roman',Times,serif;box-shadow:2px 2px 0#7b8fa3,inset 1px 1px 0#f6faff;letter-spacing:0.3px}button i{font-size:16px;color:#1d4a66}button:hover{background:#d0deec;border-color:#a7bdd3;box-shadow:1px 1px 0#7b8fa3,inset 1px 1px 0#f6faff;transform:translate(1px,1px)}button:active{border-style:inset;box-shadow:inset 2px 2px 4px rgba(0,0,0,0.2);transform:translate(2px,2px)}.btn-primary{background:#b3cde0;border-color:#8aadc7;color:#062336}.btn-primary i{color:#0b3b57}.btn-secondary{background:#c6d4e0;border-color:#9db2c7;color:#102b40}.btn-danger{background:#e4d2d2;border-color:#c9aeb0;color:#4f2a2e}.btn-danger i{color:#8f4e54}.status{padding:10px 16px;border:3px ridge#b3c6d8;margin-top:16px;font-size:15px;display:none;background:#e4ecf5;border-left:8px solid#3f7193;font-family:'Times New Roman',Times,serif}.status.ok{display:block;background:#dce8f2;border-left-color:#2d6a8f}.status.err{display:block;background:#f3e2e2;border-left-color:#b34a4a;color:#561e1e}.hint{font-size:14px;color:#2d4b63;margin-top:16px;padding-top:12px;border-top:2px solid#b3c6d8;display:flex;align-items:center;gap:10px}.hint i{color:#3d6b88}.canvas-wrap{display:flex;gap:30px;flex-wrap:wrap;margin-top:6px}.canvas-box{flex:1 1 280px;min-width:240px}.canvas-box h3{font-size:18px;font-weight:700;color:#132b40;margin-bottom:8px;display:flex;align-items:center;gap:10px;border-bottom:2px dotted#b3c6d8;padding-bottom:4px}.canvas-box h3 i{color:#2c5a79}canvas{width:100%;height:auto;max-width:100%;background:#d5dfe9;border:4px ridge#a7bccf;display:block;box-shadow:4px 4px 6px rgba(0,0,0,0.10)}.download-link{display:inline-flex;align-items:center;gap:8px;margin-top:12px;color:#003057;text-decoration:none;font-weight:700;font-size:15px;border:3px outset#b3c6da;padding:4px 18px 4px 14px;background:#dae4ef;box-shadow:inset 1px 1px 0#f6faff,inset-1px-1px 0#9aafc0}.download-link:hover{background:#ccd9e7;border-color:#9db3c9;text-decoration:none}.download-link i{font-size:15px;color:#1d4a66}.key-input-wrapper{display:flex;gap:10px;align-items:center}.key-input-wrapper input[type="text"]{flex:1;margin-bottom:0}.btn-random-key{background:#d2dfeb;border:3px outset#b3c6da;padding:6px 18px;font-size:15px;font-weight:bold;color:#123048;cursor:pointer;font-family:'Times New Roman',Times,serif;box-shadow:inset 1px 1px 0#f6faff,inset-1px-1px 0#9aafc0;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;height:42px;flex-shrink:0}.btn-random-key:hover{background:#c2d2e2;border-color:#9db3c9}.btn-random-key i{color:#1f4e6b;font-size:16px}@media(max-width:640px){body{padding:12px}.container{padding:16px}.header{flex-direction:column;align-items:flex-start;gap:8px}.checkbox-group{flex-direction:column;gap:10px}.key-input-wrapper{flex-wrap:wrap}.btn-random-key{width:100%;justify-content:center}}</style></head><body><div class="container"><div class="header"><h1><i class="fas fa-cubes"></i>图片块打乱·还原</h1><span class="subtitle"><i class="fas fa-lock"></i>两层加密·密钥控制</span></div><!--主操作区：移除多余卡片边框--><div class="block"><div class="row"><div class="col"><label><i class="fas fa-image"></i>选择图片</label><input type="file"id="fileInput"accept="image/*"></div><div class="col"><label><i class="fas fa-key"></i>密钥(Key)</label><div class="key-input-wrapper"><input type="text"id="keyInput"value="12345"placeholder="任意数字或字符串"><button class="btn-random-key"id="btnRandomKey"title="随机6位小写hex"><i class="fas fa-shuffle"></i>随机</button></div></div></div><div class="row"><div class="col"><label><i class="fas fa-th"></i>块大小(像素)</label><input type="number"id="blockSize"value="30"min="2"max="64"step="2"></div><div class="col"><label><i class="fas fa-expand"></i>最大输出尺寸</label><input type="number"id="maxDim"value="1024"min="128"max="4096"step="128"></div></div><div class="checkbox-group"><label><input type="checkbox"id="optPermute"checked><span>块顺序置换</span><span class="badge on"id="badge1">ON</span></label><label><input type="checkbox"id="optTransform"checked><span>块内变换(旋转/翻转)</span><span class="badge on"id="badge2">ON</span></label></div><div class="btn-group"><button class="btn-primary"id="btnScramble"><i class="fas fa-arrow-right-arrow-left"></i>打乱(加密)</button><button class="btn-secondary"id="btnRestore"><i class="fas fa-undo-alt"></i>还原(解密)</button><button class="btn-danger"id="btnClear"><i class="fas fa-trash-can"></i>清空</button></div><div class="status"id="status"></div></div><!--显示区域--><div class="block"style="border-bottom: none; padding-bottom: 0;"><div class="canvas-wrap"><div class="canvas-box"><h3><i class="far fa-file-image"></i>原始/当前</h3><canvas id="canvasOriginal"></canvas></div><div class="canvas-box"><h3><i class="fas fa-wand-magic-sparkles"></i>处理后<span id="modeLabel"style="font-weight:400;color:#2d5575;"></span></h3><canvas id="canvasResult"></canvas><a href="#"class="download-link"id="downloadLink"style="display:none;"><i class="fas fa-download"></i>下载PNG</a></div></div><div class="hint"><i class="fas fa-circle-info"></i>仅使用块置换与块内变换，对JPEG友好。下载为PNG保留无损结果。</div></div></div><script>(function(){function showStatus(msg,type){const el=document.getElementById('status');el.className='status '+(type||'ok');el.style.display='block';el.textContent=msg}function randomHex6(){let result='';const chars='0123456789abcdef';for(let i=0;i<6;i++){result+=chars[Math.floor(Math.random()*16)]}return result}function hashKey(str){let h=2166136261>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h>>>0}function mulberry32(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}function shuffleArray(arr,rng){for(let i=arr.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}function loadImage(src){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=src})}function getCanvasContext(canvas,w,h){canvas.width=w;canvas.height=h;return canvas.getContext('2d')}async function process(doScramble){const fileInput=document.getElementById('fileInput');const key=document.getElementById('keyInput').value||'12345';const blockSize=parseInt(document.getElementById('blockSize').value)||8;const maxDim=parseInt(document.getElementById('maxDim').value)||1024;const optPermute=document.getElementById('optPermute').checked;const optTransform=document.getElementById('optTransform').checked;if(!fileInput.files.length){showStatus('请先选择一张图片','err');return}let img;try{const url=URL.createObjectURL(fileInput.files[0]);img=await loadImage(url)}catch{showStatus('图片加载失败，请重试','err');return}let{width:w,height:h}=img;if(Math.max(w,h)>maxDim){if(w>h){h=Math.round(h*maxDim/w);w=maxDim}else{w=Math.round(w*maxDim/h);h=maxDim}}const cols=Math.floor(w/blockSize);const rows=Math.floor(h/blockSize);w=cols*blockSize;h=rows*blockSize;const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);const imageData=ctx.getImageData(0,0,w,h);const data=imageData.data;const numBlocks=cols*rows;const seed=hashKey(String(key));const rng=mulberry32(seed);const order=optPermute?shuffleArray([...Array(numBlocks).keys()],rng):[...Array(numBlocks).keys()];const transforms=optTransform?Array.from({length:numBlocks},()=>Math.floor(rng()*8)):new Array(numBlocks).fill(0);const result=new ImageData(w,h);const rdata=result.data;const bs=blockSize;if(doScramble){for(let newPos=0;newPos<numBlocks;newPos++){const srcPos=order[newPos];const tf=transforms[srcPos];const newBX=newPos%cols,newBY=Math.floor(newPos/cols);const srcBX=srcPos%cols,srcBY=Math.floor(srcPos/cols);for(let y=0;y<bs;y++){for(let x=0;x<bs;x++){let sx=x,sy=y;switch(tf){case 1:sx=bs-1-x;break;case 2:sy=bs-1-y;break;case 3:sx=bs-1-x;sy=bs-1-y;break;case 4:sx=y;sy=x;break;case 5:sx=y;sy=bs-1-x;break;case 6:sx=bs-1-y;sy=x;break;case 7:sx=bs-1-y;sy=bs-1-x;break}const srcIdx=((srcBY*bs+sy)*w+(srcBX*bs+sx))*4;const dstIdx=((newBY*bs+y)*w+(newBX*bs+x))*4;rdata[dstIdx]=data[srcIdx];rdata[dstIdx+1]=data[srcIdx+1];rdata[dstIdx+2]=data[srcIdx+2];rdata[dstIdx+3]=data[srcIdx+3]}}}}else{for(let i=0;i<rdata.length;i++)rdata[i]=data[i];const temp=new Uint8ClampedArray(bs*bs*4);for(let newPos=0;newPos<numBlocks;newPos++){const srcPos=order[newPos];const tf=transforms[srcPos];const newBX=newPos%cols,newBY=Math.floor(newPos/cols);const srcBX=srcPos%cols,srcBY=Math.floor(srcPos/cols);for(let y=0;y<bs;y++){for(let x=0;x<bs;x++){const si=((newBY*bs+y)*w+(newBX*bs+x))*4;const ti=(y*bs+x)*4;temp[ti]=data[si];temp[ti+1]=data[si+1];temp[ti+2]=data[si+2];temp[ti+3]=data[si+3]}}for(let y=0;y<bs;y++){for(let x=0;x<bs;x++){let sx=x,sy=y;switch(tf){case 1:sx=bs-1-x;break;case 2:sy=bs-1-y;break;case 3:sx=bs-1-x;sy=bs-1-y;break;case 4:sx=y;sy=x;break;case 5:sx=bs-1-y;sy=x;break;case 6:sx=y;sy=bs-1-x;break;case 7:sx=bs-1-y;sy=bs-1-x;break}const ti=(sy*bs+sx)*4;const di=((srcBY*bs+y)*w+(srcBX*bs+x))*4;rdata[di]=temp[ti];rdata[di+1]=temp[ti+1];rdata[di+2]=temp[ti+2];rdata[di+3]=temp[ti+3]}}}}const resCanvas=document.getElementById('canvasResult');const rctx=getCanvasContext(resCanvas,w,h);rctx.putImageData(result,0,0);const origCanvas=document.getElementById('canvasOriginal');const octx=getCanvasContext(origCanvas,w,h);octx.drawImage(img,0,0,w,h);document.getElementById('modeLabel').textContent=doScramble?'(打乱后)':'(还原后)';const link=document.getElementById('downloadLink');link.style.display='inline-flex';resCanvas.toBlob((blob)=>{const url=URL.createObjectURL(blob);link.href=url;link.download=doScramble?'scrambled.png':'restored.png'},'image/png');showStatus((doScramble?'打乱完成':'还原完成')+`·尺寸${w}×${h}·块${cols}×${rows}·密钥"${key}"`+(doScramble?'':' (需密钥/参数完全匹配)'),'ok')}document.getElementById('btnScramble').addEventListener('click',()=>process(true));document.getElementById('btnRestore').addEventListener('click',()=>process(false));document.getElementById('btnClear').addEventListener('click',()=>{document.getElementById('fileInput').value='';['canvasOriginal','canvasResult'].forEach(id=>{const c=document.getElementById(id);const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height)});document.getElementById('downloadLink').style.display='none';document.getElementById('modeLabel').textContent='';document.getElementById('status').style.display='none'});document.getElementById('btnRandomKey').addEventListener('click',()=>{const keyInput=document.getElementById('keyInput');keyInput.value=randomHex6();keyInput.dispatchEvent(new Event('input'))});document.getElementById('fileInput').addEventListener('change',async(e)=>{const file=e.target.files[0];if(!file)return;try{const img=await loadImage(URL.createObjectURL(file));const maxDim=parseInt(document.getElementById('maxDim').value)||1024;let{width:w,height:h}=img;if(Math.max(w,h)>maxDim){if(w>h){h=Math.round(h*maxDim/w);w=maxDim}else{w=Math.round(w*maxDim/h);h=maxDim}}const canvas=document.getElementById('canvasOriginal');const ctx=getCanvasContext(canvas,w,h);ctx.drawImage(img,0,0,w,h)}catch{}});function bindBadge(cbId,badgeId){const cb=document.getElementById(cbId);const badge=document.getElementById(badgeId);cb.addEventListener('change',()=>{badge.textContent=cb.checked?'ON':'OFF';badge.className='badge '+(cb.checked?'on':'off')})}bindBadge('optPermute','badge1');bindBadge('optTransform','badge2')})();</script></body></html>
